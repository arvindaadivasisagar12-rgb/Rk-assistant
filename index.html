<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK AI Assistant - Mobile Studio</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-red: #ff0000;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header for Mobile */
        .mobile-header {
            background-color: #121212;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #272727;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-red);
        }

        /* Navigation Menu for Mobile (Horizontal Scroll) */
        .nav-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 15px;
            background-color: #151515;
            border-bottom: 1px solid #272727;
            white-space: nowrap;
        }

        .nav-btn {
            background: #222;
            border: 1px solid #333;
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .nav-btn.active {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            font-weight: bold;
        }

        /* Main Body Area */
        .main-content {
            padding: 15px;
            flex: 1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.action-btn {
            background-color: var(--accent-red);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobile view: single column */
            gap: 15px;
            margin-top: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #2a2a2a;
        }

        .card h3 {
            margin-top: 0;
            font-size: 15px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 0;
        }

        .chat-response {
            background-color: #181818;
            border-radius: 8px;
            padding: 15px;
            min-height: 120px;
            border: 1px dashed #333;
            margin-top: 15px;
            white-space: pre-line;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Mobile Top Header -->
    <div class="mobile-header">
        <div class="brand">🤖 RK ASSISTANT</div>
        <span style="font-size: 12px; color: #00ff66;">● Active</span>
    </div>

    <!-- Scrollable Navigation Tabs -->
    <div class="nav-scroll">
        <button class="nav-btn active" onclick="switchTab(this, 'yt-tools')">🔴 YouTube Studio</button>
        <button class="nav-btn" onclick="switchTab(this, 'media-downloader')">📥 Stock & Chrome</button>
        <button class="nav-btn" onclick="switchTab(this, 'ai-video')">🎬 AI Video</button>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <!-- SECTION 1: YouTube Tools -->
        <div id="yt-tools" class="tab-section">
            <h3>🔴 YouTube Studio Tools</h3>
            <div class="input-group">
                <input type="text" id="yt-topic" placeholder="Topic name enter karo...">
                <div class="btn-grid">
                    <button class="action-btn" onclick="runCommand('/script')">Script Banao</button>
                    <button class="action-btn" style="background:#333;" onclick="runCommand('/yt_metadata')">Tags Banao</button>
                </div>
            </div>

            <div class="chat-response" id="yt-output">Topic likhein aur button dabayein...</div>
            
            <div class="card-grid">
                <div class="card">
                    <h3>📊 Channel Analytics</h3>
                    <p>Total Views: <b>125,400</b></p>
                </div>
            </div>
        </div>

        <!-- SECTION 2: Stock Media -->
        <div id="media-downloader" class="tab-section" style="display:none;">
            <h3>🌐 Stock & Web Sourcing</h3>
            <div class="input-group">
                <input type="text" id="media-query" placeholder="Search Video or Paste Link...">
                <button class="action-btn" onclick="runCommand('/chrome_search')">Search Media</button>
            </div>
            <div class="chat-response" id="media-output">RK media links yahan dikhayega...</div>
        </div>

        <!-- SECTION 3: AI Video -->
        <div id="ai-video" class="tab-section" style="display:none;">
            <h3>🎬 AI Video Generator</h3>
            <div class="input-group">
                <textarea id="ai-prompt" rows="3" placeholder="AI Video prompt enter karein..."></textarea>
                <button class="action-btn" onclick="runCommand('/generate_aivideo')">Generate Video</button>
            </div>
            <div class="chat-response" id="aivideo-output">Video status yahan dikhega...</div>
        </div>

    </div>

    <script>
        function switchTab(btnElement, tabId) {
            document.querySelectorAll('.tab-section').forEach(sec => sec.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).style.display = 'block';
            btnElement.classList.add('active');
        }

        function runCommand(commandType) {
            if (commandType === '/script') {
                let topic = document.getElementById('yt-topic').value || "Default Topic";
                document.getElementById('yt-output').innerText = "⏳ Generating Script for: " + topic + "\n\n[Hook]: Kya aapko pata hai...\n[Body]: RK Assistant aapki script ready kar raha hai!";
            } 
            else if (commandType === '/yt_metadata') {
                let topic = document.getElementById('yt-topic').value || "Default Topic";
                document.getElementById('yt-output').innerText = "🏷️ Metadata:\n\nTitle: " + topic + " - Full Guide\nTags: #" + topic.replace(/\s+/g, '') + " #Viral";
            }
            else if (commandType === '/chrome_search') {
                let query = document.getElementById('media-query').value || "Nature";
                document.getElementById('media-output').innerText = "🔍 Result for: " + query + "\n\n1. [Download HD Stock Clip 1]\n2. [Download HD Stock Clip 2]";
            }
            else if (commandType === '/generate_aivideo') {
                let prompt = document.getElementById('ai-prompt').value || "Robot";
                document.getElementById('aivideo-output').innerText = "🚀 Request sent for prompt: '" + prompt + "'\n\nStatus: Creating AI Video...";
            }
        }
    </script>
</body>
          </html>
